    <style>

            padding: 0;

        header {
            background-color: #ac57f7ce;
            padding: 10px 0;
            color: white;

            z-index: 2;
        }

            font-family: monospace;

            text-decoration: none;
        }

        header nav a span:hover {

        }
        video{
            width: 50%;

        #layout{
            display: flex;

            row-gap: 35px;

        }
        img{

        }
        #row{

        }
        
.attention-box {
    background: linear-gradient(135deg, #fbc2eb 0%, #a18cd1 100%);
    border: 2px solid #ffffff;
    border-radius: 15px;
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
    color: #ffffff;
    font-family: 'Arial', sans-serif;
    padding: 20px;
    max-width: 400px;
    margin: 20px auto;
    text-align: center;
    position: relative;
    opacity: 0; /* Initially hidden */
    animation: fadeIn 1s forwards;
}

.attention-box h2 {
    font-family: 'Brush Script MT', cursive;
    font-size: 31px;
    margin-bottom: 15px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

.attention-box p {
    font-size: 23px;
    line-height: 1.6;
    margin-bottom: 20px;
}

.attention-box .highlight {
    font-weight: bold;
    color: #ffeb3b;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
}

.attention-box .footer {
    font-size: 25px;
    font-style: italic;
    margin-top: 10px;
    color: #ffeb3b;
}

.attention-box.hidden {
    animation: fadeOut 1s forwards;
}
video#background-video {
            position: fixed;
            right: 0;
            top: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
        }

</head>

    <script>
        alert("There is a video in this page. unmute the video before play it.")

        document.addEventListener("DOMContentLoaded", function() {
    const attentionBox = document.getElementById('attentionBox');

    // Show the box when the page loads
    attentionBox.style.opacity = 1;

    // Add click event listener to the box to hide it when clicked
    attentionBox.addEventListener('click', function() {
        attentionBox.classList.add('hidden');
    });

    // Add click event listener to the entire document to hide the box when anywhere on the page is clicked
    document.addEventListener('click', function(e) {
        if (e.target !== attentionBox && !attentionBox.contains(e.target)) {
            attentionBox.classList.add('hidden');
        }
    });
});

    </script>
