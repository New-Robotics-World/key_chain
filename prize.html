<html>
    <head>
        <title>1st Prize</title>
        <link href="prize.css" rel="stylesheet">
        <script src="prize.js"></script>
    </head>
    
    <body>
        <div id="loading-screen">
            <video id="loading-video" width="100%" height="100%" autoplay muted>
              <source src="birthday wish/assets/loading screen2.mp4" type="video/mp4"> <!-- Add your video file here -->
              Your browser does not support the video tag.
            </video>
          </div>
    
    <div id="landing-page" style="display:none;">
        <video autoplay muted      loop id="background-video">
            <source src="birthday wish/assets/verification bg.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="blur-background">
            <div class="verification-box" id="verificationBox">
                <h1>Verification Required</h1>
                <p>Please select the last 5 digits of your phone number to proceed:</p>
                
                <!-- Form for selecting the last 5 digits -->
                <form id="verificationForm">
                    <select id="phoneDigits" onchange="checkOption()">
                        <option value="">--Select an option--</option>
                        <option value="89492">89492</option>
                        <option value="93628">93628</option>
                        <option value="97880">97880</option>
                        <option value="96238">96238</option>
                        <option value="other">Other</option>
                    </select>
        
                    <!-- Input field that appears when 'Other' is selected -->
                    <div id="otherInput" style="display: none;">
                        <label for="customDigits">Enter your 5-digit number:</label>
                        <input type="text" id="customDigits" placeholder="12345" maxlength="5">
                    </div>
                    
                    <button type="button" onclick="verifySelection()">Submit</button>
                </form>
            </div>
        </div>
    </div>
    </body>

    <script>
        document.getElementById('loading-video').addEventListener('ended', function () {
    // Hide the loading screen and show the landing page
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('landing-page').style.display = 'block';
  });
    </script>



</html>
